version: '3.8'

services:
  # =========================================================================
  # BASE DE DATOS POSTGRESQL 16 (CON SCHEMA Y SEEDS AUTOMÁTICOS)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password_2026}
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:z
    networks:
      - ecommerce_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ecommerce_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # SERVIDOR CACHÉ REDIS 7
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce_network

  # =========================================================================
  # BACKEND API NESTJS
  # =========================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ecommerce_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost}
      API_URL: ${API_URL:-http://localhost/api/v1}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_password_2026}
      DB_NAME: ${DB_NAME:-ecommerce_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_si2_azure_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_jwt_key_2026}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-live.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-api}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-AURA SaaS <soporte@aura.com>}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/apps/api/uploads
    networks:
      - ecommerce_network

  # =========================================================================
  # FRONTEND WEB REACT/VITE + REVERSE PROXY NGINX (PUERTO 80 PÚBLICO)
  # =========================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: ecommerce_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - ecommerce_network

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  ecommerce_network:
    driver: bridge
